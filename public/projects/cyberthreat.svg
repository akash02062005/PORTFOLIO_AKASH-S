<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bgCT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a0808"/><stop offset="1" stop-color="#080406"/></linearGradient>
    <radialGradient id="glCT" cx="50%" cy="28%" r="62%"><stop offset="0" stop-color="#ef4444" stop-opacity="0.3"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgCT)"/><rect width="800" height="500" fill="url(#glCT)"/>
  <text x="32" y="48" fill="#ffe9e9" font-size="22" font-weight="700">Cyber Threat Analyzer</text>
  <text x="32" y="70" fill="#f1a3a3" font-size="13">Rule-based inference engine &#183; severity &#183; AI advisor</text>
  <text x="700" y="56" fill="#ef4444" font-size="26" text-anchor="middle">&#128737;</text>
  <!-- telemetry -->
  <g transform="translate(32,100)">
    <rect width="230" height="300" rx="16" fill="#220a0a" stroke="#5a1e1e"/>
    <text x="18" y="34" fill="#f1a3a3" font-size="13">Telemetry facts</text>
    <g font-size="12">
      <text x="18" y="64" fill="#ffe9e9">failedLogins</text><text x="212" y="64" fill="#fbbf24" text-anchor="end">42</text>
      <text x="18" y="92" fill="#ffe9e9">distinctIPs</text><text x="212" y="92" fill="#fbbf24" text-anchor="end">63</text>
      <text x="18" y="120" fill="#ffe9e9">portScans</text><text x="212" y="120" fill="#ffe9e9" text-anchor="end">8</text>
      <text x="18" y="148" fill="#ffe9e9">c2Connections</text><text x="212" y="148" fill="#ef4444" text-anchor="end">2</text>
      <text x="18" y="176" fill="#ffe9e9">trafficSpike</text><text x="212" y="176" fill="#fbbf24" text-anchor="end">240%</text>
      <text x="18" y="204" fill="#ffe9e9">processAnomaly</text><text x="212" y="204" fill="#ef4444" text-anchor="end">true</text>
    </g>
    <rect x="18" y="226" width="194" height="56" rx="10" fill="#ef4444" opacity="0.12"/>
    <text x="32" y="248" fill="#ef4444" font-size="11">Forward-chaining engine</text>
    <text x="32" y="268" fill="#ef4444" font-size="11">7 facts &#183; 6 operators</text>
  </g>
  <!-- threat results -->
  <g transform="translate(278,100)">
    <rect width="260" height="300" rx="16" fill="#220a0a" stroke="#5a1e1e"/>
    <text x="18" y="34" fill="#f1a3a3" font-size="13">Detected threats</text>
    <g>
      <rect x="18" y="48" width="224" height="52" rx="10" fill="#2c0d0d"/><rect x="18" y="48" width="6" height="52" rx="3" fill="#ef4444"/>
      <text x="36" y="72" fill="#ffe9e9" font-size="13" font-weight="600">C2 Communication</text><text x="36" y="90" fill="#f1a3a3" font-size="11">Critical &#183; 100%</text>
      <rect x="18" y="108" width="224" height="52" rx="10" fill="#2c0d0d"/><rect x="18" y="108" width="6" height="52" rx="3" fill="#ef4444"/>
      <text x="36" y="132" fill="#ffe9e9" font-size="13" font-weight="600">Distributed Attack</text><text x="36" y="150" fill="#f1a3a3" font-size="11">Critical &#183; 92%</text>
      <rect x="18" y="168" width="224" height="52" rx="10" fill="#2c0d0d"/><rect x="18" y="168" width="6" height="52" rx="3" fill="#f59e0b"/>
      <text x="36" y="192" fill="#ffe9e9" font-size="13" font-weight="600">Brute Force</text><text x="36" y="210" fill="#f1a3a3" font-size="11">High &#183; 78%</text>
    </g>
    <g font-size="11">
      <rect x="18" y="234" width="52" height="22" rx="11" fill="#ef4444" opacity="0.2"/><text x="30" y="249" fill="#ef4444">Crit 2</text>
      <rect x="78" y="234" width="48" height="22" rx="11" fill="#f59e0b" opacity="0.2"/><text x="90" y="249" fill="#f59e0b">High 1</text>
      <rect x="134" y="234" width="58" height="22" rx="11" fill="#fbbf24" opacity="0.2"/><text x="146" y="249" fill="#fbbf24">Med 0</text>
    </g>
  </g>
  <!-- AI advisor + confidence -->
  <g transform="translate(554,100)">
    <rect width="214" height="145" rx="14" fill="#220a0a" stroke="#5a1e1e"/>
    <circle cx="44" cy="44" r="18" fill="#ef4444"/><text x="36" y="50" fill="#fff" font-size="16">&#129302;</text>
    <text x="74" y="40" fill="#ffe9e9" font-size="13" font-weight="600">AI advisor</text>
    <text x="74" y="58" fill="#f1a3a3" font-size="11">CVE lookup</text>
    <rect x="18" y="84" width="178" height="9" rx="4" fill="#5a1e1e"/><rect x="18" y="102" width="140" height="9" rx="4" fill="#5a1e1e"/>
    <rect y="160" width="214" height="140" rx="14" fill="#220a0a" stroke="#5a1e1e"/>
    <text x="18" y="190" fill="#f1a3a3" font-size="13">Confidence</text>
    <text x="18" y="236" fill="#ef4444" font-size="38" font-weight="700">96%</text>
    <rect x="18" y="252" width="178" height="10" rx="5" fill="#5a1e1e"/><rect x="18" y="252" width="171" height="10" rx="5" fill="#ef4444"/>
    <text x="18" y="284" fill="#f1a3a3" font-size="11">React &#183; TS &#183; Vite &#183; shadcn/ui</text>
  </g>
