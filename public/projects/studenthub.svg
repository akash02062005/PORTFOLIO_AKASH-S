      <circle cx="34" cy="98" r="12" fill="#22d3ee"/><text x="56" y="102" fill="#fff6e6">CSE-2023-014 · Diya</text><text x="300" y="102" fill="#34d399">8.95</text>
      <circle cx="34" cy="132" r="12" fill="#ec4899"/><text x="56" y="136" fill="#fff6e6">CSE-2023-027 · Karthik</text><text x="300" y="136" fill="#f59e0b">7.80</text>
      <circle cx="34" cy="166" r="12" fill="#8b5cf6"/><text x="56" y="170" fill="#fff6e6">CSE-2023-039 · Meera</text><text x="300" y="170" fill="#34d399">9.05</text>
