      <rect x="124" y="166" width="92" height="40" rx="9" fill="#22d3ee" opacity="0.16"/><text x="138" y="184" fill="#22d3ee" font-weight="600">FACULTY</text><text x="138" y="199" fill="#9fe9f5">grades</text>
