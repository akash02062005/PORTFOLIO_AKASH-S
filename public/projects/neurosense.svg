  <rect x="32" y="350" width="736" height="30" rx="8" fill="#8b5cf6" opacity="0.12"/>
  <text x="48" y="370" fill="#c4b5fd" font-size="12">&#9889; FastAPI &#183; Next.js 14 &#183; PyTorch &#183; WebSocket streaming &#183; &lt;600ms latency &#183; crisis detection</text>
