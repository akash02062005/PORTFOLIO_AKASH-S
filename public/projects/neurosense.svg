<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bgN" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#150a2e"/><stop offset="1" stop-color="#05030f"/></linearGradient>
    <radialGradient id="glN" cx="50%" cy="30%" r="62%"><stop offset="0" stop-color="#8b5cf6" stop-opacity="0.32"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgN)"/><rect width="800" height="500" fill="url(#glN)"/>
  <text x="32" y="48" fill="#f1e9ff" font-size="22" font-weight="700">NeuroSense AI</text>
