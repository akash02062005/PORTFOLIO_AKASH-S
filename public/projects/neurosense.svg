      <text x="20" y="234" fill="#f1e9ff" font-size="11">face</text><rect x="90" y="225" width="88" height="10" rx="5" fill="#22d3ee"/><text x="220" y="234" fill="#c4b5fd" font-size="11">0.31</text>
