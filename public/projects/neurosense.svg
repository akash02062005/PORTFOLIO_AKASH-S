      <rect x="0" y="56" width="120" height="40" rx="10" fill="#1c1140" stroke="#3b2a66"/><text x="14" y="74">&#128100; Facial</text><text x="14" y="89" fill="#b9a6e8">ViT</text>
      <rect x="0" y="112" width="120" height="40" rx="10" fill="#1c1140" stroke="#3b2a66"/><text x="14" y="130">&#128172; Text</text><text x="14" y="145" fill="#b9a6e8">RoBERTa</text>
      <rect x="0" y="168" width="120" height="40" rx="10" fill="#1c1140" stroke="#3b2a66"/><text x="14" y="186">&#128147; Physio</text><text x="14" y="201" fill="#b9a6e8">rPPG</text>
    </g>
    <g stroke="#8b5cf6" stroke-width="2" opacity="0.6">
      <line x1="120" y1="20" x2="200" y2="104"/><line x1="120" y1="76" x2="200" y2="104"/><line x1="120" y1="132" x2="200" y2="104"/><line x1="120" y1="188" x2="200" y2="104"/>
    </g>
    <circle cx="220" cy="104" r="30" fill="#8b5cf6" opacity="0.3"/><circle cx="220" cy="104" r="18" fill="#8b5cf6"/>
    <text x="220" y="160" fill="#c4b5fd" font-size="11" text-anchor="middle">cross-modal</text>
    <text x="220" y="174" fill="#c4b5fd" font-size="11" text-anchor="middle">transformer</text>
  </g>
  <!-- wellness score + explain -->
  <g transform="translate(440,100)">
    <rect width="328" height="140" rx="14" fill="#1c1140" stroke="#3b2a66"/>
    <text x="20" y="34" fill="#b9a6e8" font-size="13">Real-time wellness score</text>
    <text x="20" y="92" fill="#34d399" font-size="44" font-weight="700">78</text>
    <text x="120" y="92" fill="#b9a6e8" font-size="14">/ 100 &#183; improving</text>
    <rect x="20" y="108" width="288" height="10" rx="5" fill="#3b2a66"/><rect x="20" y="108" width="225" height="10" rx="5" fill="#34d399"/>
    <rect y="156" width="328" height="124" rx="14" fill="#1c1140" stroke="#3b2a66"/>
    <text x="20" y="184" fill="#b9a6e8" font-size="13">Explainable AI &#183; SHAP attribution</text>
    <g>
