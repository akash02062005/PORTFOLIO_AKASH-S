    <circle cx="50" cy="240" r="26" fill="#f97316" opacity="0.25"/><text x="50" y="246" fill="#f97316" font-size="22" text-anchor="middle">&#129504;</text>
    <text x="92" y="234" fill="#fff1e6" font-size="13" font-weight="600">HIIT Hero</text>
    <text x="92" y="254" fill="#fbbf90" font-size="11">40+ archetypes</text>
  </g>
