    <text x="18" y="32" fill="#fbbf90" font-size="13">Mood music</text>
    <g fill="#f97316"><rect x="18" y="50" width="8" height="40" rx="3"/><rect x="34" y="62" width="8" height="28" rx="3"/><rect x="50" y="44" width="8" height="46" rx="3"/><rect x="66" y="58" width="8" height="32" rx="3"/><rect x="82" y="50" width="8" height="40" rx="3"/></g>
    <rect x="110" y="54" width="92" height="22" rx="11" fill="#22c55e" opacity="0.2"/><text x="124" y="69" fill="#22c55e" font-size="11">Energetic</text>
    <text x="18" y="118" fill="#fbbf90" font-size="11">&#127925; Spotify &#183; YouTube</text>
    <rect y="160" width="220" height="140" rx="14" fill="#1f1206" stroke="#4d2f12"/>
