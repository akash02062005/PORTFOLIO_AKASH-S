<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bgFC" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1505"/><stop offset="1" stop-color="#0a0703"/></linearGradient>
    <radialGradient id="glFC" cx="50%" cy="30%" r="62%"><stop offset="0" stop-color="#f97316" stop-opacity="0.32"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgFC)"/><rect width="800" height="500" fill="url(#glFC)"/>
  <text x="32" y="48" fill="#fff1e6" font-size="22" font-weight="700">FitCare</text>
  <text x="32" y="70" fill="#fbbf90" font-size="13">AI fitness &#183; diet plans &#183; mood music &#183; challenges</text>
  <text x="700" y="56" fill="#f97316" font-size="26" text-anchor="middle">&#127947;</text>
  <!-- diet plan card -->
