    <text x="18" y="34" fill="#fbbf90" font-size="13">AI diet plan</text>
    <g font-size="12">
      <rect x="18" y="50" width="204" height="40" rx="9" fill="#2c1a09"/><text x="32" y="68" fill="#fff1e6">Keto</text><text x="200" y="68" fill="#22c55e" text-anchor="end">1,800 kcal</text>
      <rect x="18" y="98" width="204" height="40" rx="9" fill="#2c1a09"/><text x="32" y="116" fill="#fff1e6">Vegan</text><text x="200" y="116" fill="#22c55e" text-anchor="end">balanced</text>
      <rect x="18" y="146" width="204" height="40" rx="9" fill="#2c1a09"/><text x="32" y="164" fill="#fff1e6">Indian</text><text x="200" y="164" fill="#22c55e" text-anchor="end">high protein</text>
    </g>
    <text x="18" y="220" fill="#fbbf90" font-size="13">BMI</text>
    <rect x="18" y="232" width="204" height="12" rx="6" fill="#2c1a09"/><rect x="18" y="232" width="128" height="12" rx="6" fill="#f97316"/>
    <circle cx="146" cy="238" r="9" fill="#fff1e6"/>
    <text x="18" y="272" fill="#22c55e" font-size="14" font-weight="700">22.4 &#183; Healthy</text>
  </g>
