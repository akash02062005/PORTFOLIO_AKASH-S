      <rect x="18" y="94" width="208" height="36" rx="9" fill="#2c1a09"/><text x="34" y="117" fill="#fff1e6">&#9989; Clean eating</text>
      <rect x="18" y="138" width="208" height="36" rx="9" fill="#2c1a09"/><text x="34" y="161" fill="#fff1e6">&#9203; Sleep optimization</text>
      <rect x="18" y="182" width="208" height="36" rx="9" fill="#2c1a09"/><text x="34" y="205" fill="#fff1e6">&#9203; Strength building</text>
    </g>
    <rect x="18" y="236" width="208" height="46" rx="10" fill="#f97316" opacity="0.14"/>
    <text x="32" y="256" fill="#f97316" font-size="11">React 19 &#183; Express 5 &#183; MongoDB</text>
