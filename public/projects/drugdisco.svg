<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, sans-serif">
  <defs>
    <linearGradient id="bgD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0e1f"/><stop offset="1" stop-color="#04060f"/></linearGradient>
    <radialGradient id="glD" cx="50%" cy="30%" r="62%"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgD)"/><rect width="800" height="500" fill="url(#glD)"/>
  <text x="32" y="48" fill="#e6fbff" font-size="22" font-weight="700">DrugDisco AI</text>
  <text x="32" y="70" fill="#7dd3e8" font-size="13">ChemBERTa &#183; BioGPT &#183; ADMET &#183; 3D molecule viewer</text>
  <text x="700" y="56" fill="#22d3ee" font-size="26" text-anchor="middle">&#9879;</text>
  <!-- molecule graph -->
  <g transform="translate(32,100)">
    <rect width="360" height="300" rx="16" fill="#0d1430" stroke="#22325c"/>
    <text x="20" y="34" fill="#9fe9f5" font-size="13">3D molecule &#183; property prediction</text>
    <g stroke="#22d3ee" stroke-width="2.5" fill="none">
      <line x1="120" y1="120" x2="180" y2="90"/><line x1="180" y1="90" x2="240" y2="120"/>
      <line x1="240" y1="120" x2="240" y2="190"/><line x1="240" y1="190" x2="180" y2="220"/>
      <line x1="180" y1="220" x2="120" y2="190"/><line x1="120" y1="190" x2="120" y2="120"/>
      <line x1="180" y1="90" x2="180" y2="40"/><line x1="240" y1="120" x2="300" y2="100"/>
    </g>
    <g>
      <circle cx="120" cy="120" r="9" fill="#22d3ee"/><circle cx="180" cy="90" r="9" fill="#f472b6"/><circle cx="240" cy="120" r="9" fill="#22d3ee"/>
      <circle cx="240" cy="190" r="9" fill="#34d399"/><circle cx="180" cy="220" r="9" fill="#22d3ee"/><circle cx="120" cy="190" r="9" fill="#22d3ee"/>
      <circle cx="180" cy="40" r="9" fill="#fbbf24"/><circle cx="300" cy="100" r="9" fill="#f472b6"/>
    </g>
    <rect x="20" y="250" width="320" height="32" rx="8" fill="#22d3ee" opacity="0.12"/>
    <text x="34" y="271" fill="#22d3ee" font-size="12">logP 2.4 &#183; QED 0.81 &#183; Ro5 pass</text>
  </g>
  <!-- chatbot + admet -->
  <g transform="translate(420,100)">
    <rect width="348" height="140" rx="14" fill="#0d1430" stroke="#22325c"/>
    <circle cx="48" cy="44" r="20" fill="#6d5efc"/><text x="40" y="50" fill="#fff" font-size="16">&#129516;</text>
    <text x="82" y="40" fill="#e6fbff" font-size="14" font-weight="600">BioGPT chatbot</text>
    <text x="82" y="60" fill="#7dd3e8" font-size="11">15M PubMed abstracts</text>
    <rect x="20" y="84" width="308" height="9" rx="4" fill="#22325c"/><rect x="20" y="102" width="240" height="9" rx="4" fill="#22325c"/>
    <rect y="156" width="348" height="124" rx="14" fill="#0d1430" stroke="#22325c"/>
    <text x="20" y="186" fill="#9fe9f5" font-size="13">ADMET radar</text>
    <polygon points="174,200 226,224 210,272 138,272 122,224" fill="none" stroke="#34d399" stroke-width="2"/>
    <polygon points="174,214 208,230 198,262 150,262 140,230" fill="#34d399" opacity="0.25" stroke="#34d399"/>
    <text x="250" y="220" fill="#7dd3e8" font-size="11">5 DB APIs</text>
    <text x="250" y="240" fill="#7dd3e8" font-size="11">PubChem</text>
    <text x="250" y="258" fill="#7dd3e8" font-size="11">ChEMBL</text>
  </g>
</svg>
